version: 2.1

orbs:

defaults: &defaults
  working_directory: ~/project
  docker:
    - image: mcr.microsoft.com/dotnet/sdk:6.0

jobs:
  test:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Verify version metadata
          command: bash scripts/verify-version.sh
      - run:
          name: Install dependencies
          command: dotnet restore trolley.sln
      - run:
          name: Build
          command: dotnet build trolley.sln --configuration Release --no-restore
      - run:
          name: Discover tests
          command: dotnet test tests/tests.sln --configuration Release --no-build --list-tests
      - run:
          name: Run integration tests with coverage
          command: |
            if [ -n "$TROLLEY_ACCESS_KEY" ] && [ -n "$TROLLEY_SECRET_KEY" ]; then
              dotnet test tests/tests.sln \
                --configuration Release \
                --no-build \
                --verbosity normal \
                --collect:"XPlat Code Coverage" \
                --results-directory ./coverage
            else
              echo "Skipping integration tests because TROLLEY_ACCESS_KEY/TROLLEY_SECRET_KEY are not configured."
            fi
      - run:
          name: Install GPG
          command: apt-get update -qq && apt-get install -y gnupg
      - run:
          name: Upload coverage to Codecov
          when: always
          command: |
            curl -Os https://github.com/codecov/codecov-cli/releases/download/v11.2.8/codecovcli_linux
            chmod +x codecovcli_linux
            ./codecovcli_linux create-commit -t $CODECOV_TOKEN --slug trolley/dotnet-sdk --git-service github -C $CIRCLE_SHA1
            ./codecovcli_linux create-report -t $CODECOV_TOKEN --slug trolley/dotnet-sdk --git-service github -C $CIRCLE_SHA1
            ./codecovcli_linux do-upload -t $CODECOV_TOKEN --slug trolley/dotnet-sdk --git-service github -C $CIRCLE_SHA1 --file coverage/coverage-final.json
workflows:
  version: 2
  build:
    jobs:
      - test:
          context: org-global
          filters:
            tags:
              ignore: /.*/
